name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flake-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Run flake checks
        run: nix flake check

      - name: Verify update script is stable
        run: nix develop --command ./update.sh

